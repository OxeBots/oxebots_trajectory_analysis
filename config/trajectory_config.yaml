trajectory_generator_node:
  ros__parameters:
    pattern: "circle"

    # Circle configuration
    circle_center_x: 0.0
    circle_center_y: 0.0
    circle_radius: 0.8

    # Square configuration
    square_center_x: 0.0
    square_center_y: 0.0
    square_side: 1.4

    # Square wave configuration
    wave_center_x: 0.0
    wave_center_y: 0.0
    wave_amplitude: 0.5
    wave_step_length: 0.6
    wave_num_cycles: 2

    # Line configuration
    x_initial: 1.0
    y_initial: -1.0
    length: 1.0
    line_angle: 1.57

    # Discretization and tracking parameters
    total_points: 150
    path_window_size: 15
    lookahead_steps: 2
    face_center: true
    publish_rate_hz: 20.0
    frame_id: "map"
